<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>소모품관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f1f5f9;color:#1e293b}
.page{display:none}
.page.show{display:block}

/* 로그인 */
.auth-wrap{min-height:100vh;background:linear-gradient(135deg,#1d4ed8,#3b82f6);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:360px}
.auth-icon{text-align:center;font-size:48px;margin-bottom:12px}
.auth-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px}
.auth-sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:24px}
.fi{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;margin-bottom:10px;outline:none}
.fi:focus{border-color:#2563eb}
.fb{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.fb.blue{background:#2563eb;color:#fff}
.fb.gray{background:#f1f5f9;color:#64748b;font-size:13px}

/* 헤더 */
.hdr{background:#2563eb;color:#fff;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.hdr-left h1{font-size:15px;font-weight:800}
.hdr-left p{font-size:11px;opacity:.8;margin-top:1px}
.hdr-right{display:flex;gap:6px}
.hb{padding:6px 11px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}

/* 탭 */
.tabbar{display:flex;overflow-x:auto;gap:4px;padding:8px 10px;background:#fff;border-bottom:1px solid #e2e8f0}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border:none;border-radius:20px;background:#f1f5f9;color:#64748b;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:#2563eb;color:#fff}

/* 카테고리 */
.catbar{display:flex;overflow-x:auto;gap:5px;padding:8px 10px;background:#fff;border-bottom:1px solid #e2e8f0}
.catbar::-webkit-scrollbar{display:none}
.catbtn{flex-shrink:0;padding:5px 13px;border:2px solid #e2e8f0;border-radius:20px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}

/* 검색 */
.srchwrap{padding:8px 10px;background:#fff;border-bottom:1px solid #e2e8f0}
.srchwrap input{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none}

/* 물품 카드 */
.list{padding:8px 10px}
.cath{display:flex;align-items:center;gap:6px;padding:10px 2px 5px;font-size:12px;font-weight:700;color:#64748b}
.catdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card{background:#fff;border-radius:12px;margin-bottom:7px;border:1.5px solid #e2e8f0;overflow:hidden}
.card-top{display:flex;align-items:center;padding:11px 13px 7px;gap:8px}
.cbar{width:3px;height:34px;border-radius:3px;flex-shrink:0}
.cname{flex:1;min-width:0}
.cname .name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname .name.low{color:#dc2626}
.cname .memo{font-size:11px;color:#94a3b8;margin-top:1px}
.cqty{text-align:right;flex-shrink:0;padding-left:8px}
.cqty .q{font-size:16px;font-weight:800}
.cqty .q.pos{color:#059669}
.cqty .q.neg{color:#dc2626}
.cqty .q.zero{color:#cbd5e1}
.cqty .q.low{color:#dc2626}
.card-bot{display:flex;align-items:center;gap:6px;padding:6px 13px 11px;background:#f8fafc;border-top:1px solid #e2e8f0}
.qinput{width:60px;padding:8px 6px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:15px;font-weight:700;text-align:center;outline:none}
.qinput:focus{border-color:#2563eb}
.usel{flex:1;padding:8px 6px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:12px;background:#fff;outline:none}
.usel:focus{border-color:#2563eb}
.abtn{padding:8px 10px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap}
.abtn.in{background:#059669}
.abtn.out{background:#dc2626}
.abtn.ret{background:#7c3aed}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end}
.modal-bg.show{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:70vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:#e2e8f0;border-radius:4px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:800;margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tbtn{padding:13px 4px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center;color:#64748b}
.tbtn.on{background:#dc2626;color:#fff;border-color:#dc2626}
.okbtn{width:100%;padding:15px;background:#dc2626;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}

/* 거래내역 */
.tx{padding:12px 14px;background:#fff;border-radius:12px;margin-bottom:7px;border:1.5px solid #e2e8f0}
.txbadge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;margin-right:5px}
.txbadge.입고{background:#d1fae5;color:#059669}
.txbadge.출고{background:#fee2e2;color:#dc2626}
.txbadge.반납{background:#ede9fe;color:#7c3aed}
.txcont{font-size:13px;font-weight:600;margin:4px 0 2px}
.txmeta{font-size:11px;color:#94a3b8}

/* 회원관리 */
.ucard{background:#fff;border-radius:12px;margin-bottom:7px;border:1.5px solid #e2e8f0;padding:14px}
.uname{font-size:15px;font-weight:700}
.umeta{font-size:12px;color:#94a3b8;margin:3px 0 8px}
.ubtns{display:flex;gap:6px}
.ubtn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#fff}
.ubtn.ap{background:#059669}
.ubtn.rj{background:#dc2626}
.ubtn.dl{background:#94a3b8}
.slabel{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;padding:10px 2px 5px}

/* 스피너 */
.spinner-wrap{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:999;align-items:center;justify-content:center}
.spinner-wrap.show{display:flex}
.spinner{width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px;color:#94a3b8;font-size:14px}
.spacer{height:20px}
</style>
</head>
<body>

<div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
<div class="modal-box" id="modalBox"></div>
</div>

<!-- 로그인 -->
<div id="pgLogin" class="page show">
<div class="auth-wrap"><div class="auth-box">
  <div class="auth-icon">📦</div>
  <div class="auth-title">소모품관리</div>
  <div class="auth-sub">사번과 비밀번호를 입력하세요</div>
  <input class="fi" id="lId" placeholder="사번" type="text">
  <input class="fi" id="lPw" placeholder="비밀번호" type="password">
  <button class="fb blue" id="loginBtn">로그인</button>
  <button class="fb gray" id="toRegBtn">처음이세요? 회원가입</button>
</div></div>
</div>

<!-- 회원가입 -->
<div id="pgReg" class="page">
<div class="auth-wrap"><div class="auth-box">
  <div class="auth-icon">✍️</div>
  <div class="auth-title">회원가입</div>
  <div class="auth-sub">정보를 입력하세요</div>
  <input class="fi" id="rName" placeholder="이름">
  <input class="fi" id="rId" placeholder="사번" type="text">
  <input class="fi" id="rPw" placeholder="비밀번호" type="password">
  <select class="fi" id="rTeam">
    <option value="">팀 선택</option>
    <option value="화성">화성</option>
    <option value="수원">수원</option>
    <option value="평택">평택</option>
    <option value="2팀">2팀</option>
    <option value="3팀">3팀</option>
    <option value="4팀">4팀</option>
    <option value="5팀">5팀</option>
    <option value="6팀">6팀</option>
    <option value="창고">창고관리자</option>
  </select>
  <button class="fb blue" id="regBtn">가입 신청</button>
  <button class="fb gray" id="toLoginBtn">← 로그인으로</button>
</div></div>
</div>

<!-- 메인 -->
<div id="pgApp" class="page">
  <div class="hdr">
    <div class="hdr-left">
      <h1>📦 소모품관리</h1>
      <p id="hSub"></p>
    </div>
    <div class="hdr-right">
      <button id="adminBtn" class="hb" style="background:rgba(255,255,255,.2);color:#fff;display:none">👥 관리자</button>
      <button id="reloadBtn" class="hb" style="background:rgba(255,255,255,.2);color:#fff">🔄</button>
      <button id="logoutBtn" class="hb" style="background:rgba(255,255,255,.15);color:#fff">로그아웃</button>
    </div>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="catbar" id="catbar"></div>
  <div class="srchwrap" id="srchwrap"><input id="srchInput" placeholder="🔍 물품 검색..."></div>
  <div class="list" id="content"></div>
  <div class="spacer"></div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyXCuF8KbWh8ty5cP5K7kuYaUyXJ2DwYXeM6W6UWwypqOqX3ZbHNlnFY7xocKOCA0Et/exec';
var ADMIN = '218062';
var TABS = ['창고','화성','수원','평택','2팀','3팀','4팀','5팀','6팀','거래내역'];
var CATS = ['채혈채뇨','공용물품','청력','HRV','EKG','폐활량','전체'];
var CCOLORS = {'채혈채뇨':'#2563EB','공용물품':'#64748B','청력':'#D97706','HRV':'#0891B2','EKG':'#DB2777','폐활량':'#475569','전체':'#059669'};

var user = null;
var curTab = '창고';
var curCat = '채혈채뇨';
var items = [];
var teamStocks = {};
var txs = [];
var pendingOut = null;

function g(id) { return document.getElementById(id); }
function v(id) { return (g(id) ? g(id).value.trim() : ''); }
function show(id) { document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('show'); }); g(id).classList.add('show'); }
function spin(on) { g('spinner').classList[on?'add':'remove']('show'); }
function showModal() { g('modalBg').classList.add('show'); }
function closeModal() { g('modalBg').classList.remove('show'); }
function eid(s) { return s.replace(/[^a-zA-Z0-9가-힣]/g,'_'); }

function postApi(body, cb) {
  spin(true);
  fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(d){ spin(false); cb(null, d); })
    .catch(function(e){ spin(false); cb(e); });
}

function getApi(action, cb) {
  spin(true);
  fetch(API + '?action=' + action + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ spin(false); cb(null, d); })
    .catch(function(e){ spin(false); cb(e); });
}

// 단위 변환
function parseR(memo) {
  var r = {BX:null, PK:null};
  if (!memo) return r;
  var bx = memo.match(/1\s*BX\s*[=x]\s*(\d+)\s*EA/i);
  if (bx) r.BX = parseInt(bx[1]);
  var pk = memo.match(/1\s*PK\s*[=x]\s*(\d+)\s*EA/i);
  if (pk) r.PK = parseInt(pk[1]);
  var bp = memo.match(/1\s*BX\s*[=x]\s*(\d+)\s*PK/i);
  if (bp && r.PK) r.BX = parseInt(bp[1]) * r.PK;
  return r;
}

function toEA(qty, unit, r) {
  if (unit === 'BX') return qty * (r.BX || 1);
  if (unit === 'PK') return qty * (r.PK || 1);
  return qty;
}

function dispQty(ea, r, unit) {
  var n = Math.max(0, parseInt(ea) || 0);
  if (!r.BX && !r.PK) return n + ' ' + (unit || 'EA');
  var rem = n, parts = [];
  if (r.BX && rem >= r.BX) { var v = Math.floor(rem/r.BX); rem = rem%r.BX; if(v) parts.push(v+'BX'); }
  if (r.PK && rem >= r.PK) { var v = Math.floor(rem/r.PK); rem = rem%r.PK; if(v) parts.push(v+'PK'); }
  if (rem || !parts.length) parts.push(rem+'EA');
  return parts.join(' ');
}

// 인증
g('toRegBtn').onclick = function() { show('pgReg'); };
g('toLoginBtn').onclick = function() { show('pgLogin'); };

g('loginBtn').onclick = function() {
  var empId = v('lId'), pass = v('lPw');
  if (!empId || !pass) { alert('사번과 비밀번호를 입력하세요'); return; }
  postApi({action:'login', empId:empId, pass:pass}, function(err, r) {
    if (err) { alert('서버 오류'); return; }
    if (r.success) {
      user = r.user;
      user.password = pass;
      localStorage.setItem('invUser', JSON.stringify(user));
      startApp();
    } else {
      alert(r.error || '로그인 실패');
    }
  });
};

g('regBtn').onclick = function() {
  var name = v('rName'), empId = v('rId'), pass = v('rPw'), team = v('rTeam');
  if (!name || !empId || !pass || !team) { alert('모든 항목을 입력하세요'); return; }
  postApi({action:'register', empId:empId, name:name, pass:pass, team:team}, function(err, r) {
    if (err) { alert('서버 오류'); return; }
    if (r.success) {
      alert(r.message || '완료');
      if (r.user) {
        user = r.user;
        user.password = pass;
        localStorage.setItem('invUser', JSON.stringify(user));
        startApp();
      } else {
        show('pgLogin');
      }
    } else {
      alert(r.error || '가입 실패');
    }
  });
};

g('logoutBtn').onclick = function() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem('invUser');
  user = null;
  g('lId').value = '';
  g('lPw').value = '';
  show('pgLogin');
};

g('reloadBtn').onclick = function() {
  localStorage.removeItem('invCache');
  loadData(true);
};

g('adminBtn').onclick = function() { goTab('관리자'); };

g('srchInput').oninput = function() { render(); };

// 앱 시작
function startApp() {
  show('pgApp');
  g('hSub').textContent = user.name + ' · ' + user.team;
  if (String(user.empId) === ADMIN) g('adminBtn').style.display = 'block';
  buildTabs();
  buildCats();
  loadData(false);
}

function buildTabs() {
  var all = TABS.slice();
  if (String(user.empId) === ADMIN) all.push('관리자');
  g('tabbar').innerHTML = all.map(function(t) {
    var label = t === '창고' ? '🏭창고' : t === '거래내역' ? '📋거래' : t === '관리자' ? '👥관리자' : t;
    return '<button class="tab' + (t === curTab ? ' on' : '') + '" data-tab="' + t + '">' + label + '</button>';
  }).join('');
  g('tabbar').querySelectorAll('.tab').forEach(function(btn) {
    btn.onclick = function() { goTab(this.dataset.tab); };
  });
}

function buildCats() {
  var hide = curTab === '거래내역' || curTab === '관리자';
  g('catbar').style.display = hide ? 'none' : 'flex';
  g('srchwrap').style.display = hide ? 'none' : 'block';
  if (hide) return;
  g('catbar').innerHTML = CATS.map(function(c) {
    var col = CCOLORS[c];
    var on = c === curCat;
    return '<button class="catbtn" data-cat="' + c + '" style="' +
      (on ? 'background:' + col + ';color:#fff;border-color:' + col : 'color:' + col + ';border-color:' + col + '40') +
      '">' + c + '</button>';
  }).join('');
  g('catbar').querySelectorAll('.catbtn').forEach(function(btn) {
    btn.onclick = function() { goCat(this.dataset.cat); };
  });
}

function goTab(t) {
  curTab = t;
  buildTabs();
  buildCats();
  render();
}

function goCat(c) {
  curCat = c;
  buildCats();
  render();
}

// 데이터
function loadData(force) {
  if (!force) {
    var c = localStorage.getItem('invCache');
    if (c) {
      try {
        var p = JSON.parse(c);
        if (Date.now() - p.t < 180000) {
          items = p.items; teamStocks = p.ts; txs = p.txs;
          render(); return;
        }
      } catch(e) {}
    }
  }
  getApi('getAll', function(err, d) {
    if (err) { alert('로딩 실패'); return; }
    items = d.items || [];
    teamStocks = d.teamStocks || {};
    txs = d.transactions || [];
    localStorage.setItem('invCache', JSON.stringify({items:items, ts:teamStocks, txs:txs, t:Date.now()}));
    render();
  });
}

// 렌더링
function render() {
  var el = g('content');
  if (curTab === '거래내역') { renderTx(el); return; }
  if (curTab === '관리자') { renderAdmin(el); return; }

  var q = g('srchInput').value.toLowerCase();
  var isWH = curTab === '창고';
  var list = items.map(function(i) {
    var r = parseR(i.memo);
    var eaQty = isWH ? i.eaQty : ((teamStocks[curTab] || {})[i.name] ? teamStocks[curTab][i.name].eaQty : 0);
    return {name:i.name, unit:i.unit, memo:i.memo, category:i.category, eaQty:eaQty, r:r, dsp:dispQty(eaQty,r,i.unit)};
  }).filter(function(i) {
    if (q && i.name.toLowerCase().indexOf(q) < 0) return false;
    if (curCat !== '전체' && i.category !== curCat) return false;
    if (!isWH && i.eaQty <= 0) return false;
    return true;
  });

  if (!list.length) { el.innerHTML = '<div class="empty">📭 물품이 없습니다</div>'; return; }

  var html = '';
  if (curCat === '전체') {
    var grp = {};
    list.forEach(function(i) { if (!grp[i.category]) grp[i.category] = []; grp[i.category].push(i); });
    CATS.filter(function(c){ return c !== '전체'; }).forEach(function(cat) {
      if (!grp[cat] || !grp[cat].length) return;
      var col = CCOLORS[cat] || '#94a3b8';
      html += '<div class="cath"><span class="catdot" style="background:' + col + '"></span><span style="color:' + col + '">' + cat + ' (' + grp[cat].length + ')</span></div>';
      grp[cat].forEach(function(i) { html += itemCard(i, isWH); });
    });
  } else {
    list.forEach(function(i) { html += itemCard(i, isWH); });
  }
  el.innerHTML = html;
}

function itemCard(i, isWH) {
  var col = CCOLORS[i.category] || '#94a3b8';
  var r = i.r;
  var low = i.eaQty > 0 && i.eaQty < 5;
  var qc = i.eaQty > 0 ? (low ? 'low' : 'pos') : i.eaQty < 0 ? 'neg' : 'zero';
  var defUnit = i.unit || 'EA';
  var bxL = r.BX ? 'BX(1=' + r.BX + 'EA)' : 'BX';
  var pkL = r.PK ? 'PK(1=' + r.PK + 'EA)' : 'PK';
  var nm = i.name.replace(/'/g, "\\'");
  var btns = isWH
    ? '<button class="abtn in" onclick="doIn(\'' + nm + '\')">📥입고</button><button class="abtn out" onclick="doOut(\'' + nm + '\')">📤출고</button>'
    : '<button class="abtn ret" onclick="doRet(\'' + nm + '\')">↩반납</button>';
  return '<div class="card" id="ic_' + eid(i.name) + '">' +
    '<div class="card-top">' +
      '<span class="cbar" style="background:' + col + '"></span>' +
      '<div class="cname">' +
        '<div class="name' + (low ? ' low' : '') + '">' + i.name + (low ? ' ⚠️' : '') + '</div>' +
        (i.memo ? '<div class="memo">' + i.memo + '</div>' : '') +
      '</div>' +
      '<div class="cqty"><div class="q ' + qc + '">' + i.dsp + '</div></div>' +
    '</div>' +
    '<div class="card-bot">' +
      '<input type="number" class="qinput" id="qn_' + eid(i.name) + '" value="1" min="1">' +
      '<select class="usel" id="un_' + eid(i.name) + '">' +
        '<option value="EA"' + (defUnit==='EA'?' selected':'') + '>EA</option>' +
        '<option value="PK"' + (defUnit==='PK'?' selected':'') + '>' + pkL + '</option>' +
        '<option value="BX"' + (defUnit==='BX'?' selected':'') + '>' + bxL + '</option>' +
      '</select>' +
      btns +
    '</div>' +
  '</div>';
}

// 입고
function doIn(name) {
  var item = null;
  for (var i=0; i<items.length; i++) { if(items[i].name===name){ item=items[i]; break; } }
  if (!item) return;
  var r = parseR(item.memo);
  var qty = parseInt(g('qn_'+eid(name)).value) || 1;
  var unit = g('un_'+eid(name)).value || 'EA';
  var eaQty = toEA(qty, unit, r);
  postApi({action:'warehouseIn', items:[{name:name, unit:item.unit, memo:item.memo, category:item.category, inputQty:qty, inputUnit:unit, eaQty:eaQty}], user:user.name}, function(err, res) {
    if (err) { alert('오류'); return; }
    if (res.success) { localStorage.removeItem('invCache'); loadData(true); alert('입고 완료!'); }
    else alert('오류: ' + res.error);
  });
}

// 출고 - 팀 선택
function doOut(name) {
  var item = null;
  for (var i=0; i<items.length; i++) { if(items[i].name===name){ item=items[i]; break; } }
  if (!item) return;
  var r = parseR(item.memo);
  var qty = parseInt(g('qn_'+eid(name)).value) || 1;
  var unit = g('un_'+eid(name)).value || 'EA';
  pendingOut = {name:name, item:item, qty:qty, unit:unit, eaQty:toEA(qty,unit,r)};
  g('modalBox').innerHTML = '<div class="modal-handle"></div>' +
    '<div class="modal-title">📤 ' + name + ' ' + qty + unit + ' 출고</div>' +
    '<div class="tgrid">' +
    ['화성','수원','평택','2팀','3팀','4팀','5팀','6팀'].map(function(t){
      return '<button class="tbtn" onclick="pickTeam(this,\''+t+'\')">' + t + '</button>';
    }).join('') +
    '</div>' +
    '<button class="okbtn" onclick="confirmOut()">출고 확인</button>';
  showModal();
}

function pickTeam(el, team) {
  document.querySelectorAll('.tbtn').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  pendingOut.team = team;
}

function confirmOut() {
  if (!pendingOut || !pendingOut.team) { alert('팀을 선택하세요'); return; }
  var po = pendingOut;
  closeModal();
  postApi({action:'warehouseOut', items:[{name:po.name, unit:po.item.unit, memo:po.item.memo, category:po.item.category, inputQty:po.qty, inputUnit:po.unit, eaQty:po.eaQty}], team:po.team, user:user.name}, function(err, res) {
    if (err) { alert('오류'); return; }
    if (res.success) { pendingOut=null; localStorage.removeItem('invCache'); loadData(true); alert(po.team+'으로 출고 완료!'); }
    else alert('오류: ' + res.error);
  });
}

// 반납
function doRet(name) {
  var item = null;
  for (var i=0; i<items.length; i++) { if(items[i].name===name){ item=items[i]; break; } }
  var r = item ? parseR(item.memo) : {BX:null,PK:null};
  var qty = parseInt(g('qn_'+eid(name)).value) || 1;
  var unit = g('un_'+eid(name)).value || 'EA';
  if (!confirm(name + ' ' + qty + unit + ' 반납할까요?')) return;
  postApi({action:'teamReturn', items:[{name:name, unit:item?item.unit:unit, memo:item?item.memo:'', category:item?item.category:'', inputQty:qty, inputUnit:unit, eaQty:toEA(qty,unit,r)}], team:curTab, user:user.name}, function(err, res) {
    if (err) { alert('오류'); return; }
    if (res.success) { localStorage.removeItem('invCache'); loadData(true); alert('반납 완료!'); }
    else alert('오류: ' + res.error);
  });
}

// 거래내역
function renderTx(el) {
  if (!txs.length) { el.innerHTML='<div class="empty">📋 거래내역 없음</div>'; return; }
  el.innerHTML = txs.map(function(t) {
    return '<div class="tx"><span class="txbadge ' + t.type + '">' + t.type + '</span><span style="font-size:11px;color:#94a3b8">' + (t.date||'') + '</span>' +
      '<div class="txcont">' + (t.content||'') + '</div>' +
      '<div class="txmeta">' + (t.from||'') + ' → ' + (t.to||'') + ' · ' + (t.user||'') + '</div></div>';
  }).join('');
}

// 회원관리
function renderAdmin(el) {
  postApi({action:'getUsers'}, function(err, r) {
    if (err || !r.success) { el.innerHTML='<div class="empty">오류</div>'; return; }
    var pend = r.users.filter(function(u){ return u.status==='대기'; });
    var appr = r.users.filter(function(u){ return u.status==='승인'; });
    var html = '<div class="list">';
    if (pend.length) {
      html += '<div class="slabel">⏳ 승인 대기 (' + pend.length + '명)</div>';
      pend.forEach(function(u) {
        html += '<div class="ucard"><div class="uname">' + u.name + '</div><div class="umeta">' + u.empId + ' · ' + u.team + '</div>' +
          '<div class="ubtns"><button class="ubtn ap" onclick="approveU(\'' + u.empId + '\')">승인</button><button class="ubtn rj" onclick="delU(\'' + u.empId + '\',\'' + u.name + '\')">거부</button></div></div>';
      });
    }
    if (appr.length) {
      html += '<div class="slabel">✅ 승인된 사용자 (' + appr.length + '명)</div>';
      appr.forEach(function(u) {
        html += '<div class="ucard"><div class="uname">' + u.name + '</div><div class="umeta">' + u.empId + ' · ' + u.team + '</div>' +
          '<div class="ubtns"><button class="ubtn dl" onclick="delU(\'' + u.empId + '\',\'' + u.name + '\')">삭제</button></div></div>';
      });
    }
    el.innerHTML = html + '</div>';
  });
}

function approveU(empId) {
  if (!confirm('승인?')) return;
  postApi({action:'approveUser', empId:empId}, function(err, r) {
    if (r && r.success) { alert('완료'); renderAdmin(g('content')); }
    else alert(r ? r.error : '오류');
  });
}

function delU(empId, name) {
  if (!confirm(name + ' 삭제?')) return;
  postApi({action:'deleteUser', empId:empId}, function(err, r) {
    if (r && r.success) { alert('완료'); renderAdmin(g('content')); }
    else alert(r ? r.error : '오류');
  });
}

// 초기화
window.onload = function() {
  var s = localStorage.getItem('invUser');
  if (s) {
    try { user = JSON.parse(s); startApp(); } catch(e) { show('pgLogin'); }
  }
};
</script>
