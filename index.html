function parseCurrentLocation(row){const val=row.location||'';if(!val||!val.trim())return{location:"미선택",date:null};const str=val.toString().trim();const dateMatch=str.match(/\((\d{1,2})\/(\d{1,2})\)/);const date=dateMatch?dateMatch[1].padStart(2,'0')+'/'+dateMatch[2].padStart(2,'0'):null;const cleanStr=str.replace(/\(.*?\)/g,'').trim();let location="미선택";if(cleanStr.includes('아산1'))location='아산1';else if(cleanStr.includes('화성'))location='화성';else if(cleanStr.includes('평택'))location='평택';else if(cleanStr.includes('수원'))location='수원';else if(cleanStr.includes('사무실'))location='사무실';else if(cleanStr.includes('센터'))location='센터';else if(cleanStr.includes('의공실'))location='의공실';else if(cleanStr.includes('1팀')||cleanStr.trim()==='1')location='화성';else{const match=cleanStr.match(/(?:^|[^\d])([2-6])(?:팀|[^\d]|$)/);if(match)location=match[1];else if(cleanStr.trim()!=='')location=cleanStr.trim()}return{location,date}}
function isRealIssue(text){if(!text||!text.trim())return false;const clean=text.replace(/\s/g,"").toLowerCase();if(clean.match(/wt\d+/)||clean.match(/nt\d+/)||clean.match(/dm\d+/))return false;for(const ig of IGNORE_TEXT){const cleanIgnore=ig.replace(/\s/g,"").toLowerCase();if(clean===cleanIgnore||clean.includes(cleanIgnore))return false}return true}

function eqCard(r,idx){const data=parseCurrentLocation(r);const locDisp=/^[1-6]$/.test(data.location)?data.location+'팀':data.location;let title=locDisp+' 보유 / '+r.category+'('+(data.date||'')+') / '+r.assetNo;if(r.model&&r.serial){title+=' (모델명 - '+r.model+', S/N - '+r.serial+')'}if(r.category==='폐활량'&&LUNG[r.assetNo]){title+=' (노트북 - '+LUNG[r.assetNo].model+', S/N - '+LUNG[r.assetNo].sn+')'}if(r.category==='청력기'&&AUDIO[r.assetNo]){title+=' (헤드셋 - '+AUDIO[r.assetNo]+')'}const equipKey=r.assetNo||('idx-'+idx);const equipData=JSON.stringify({assetNo:equipKey,category:r.category,name:r.name||r.category,model:r.model||'',serial:r.serial||''}).replace(/'/g,'&apos;');const lastDate=r.currentDetailDate||'';const fDate=data.date||'';const memoText=r.currentDetail||'';const hasIssue=isRealIssue(memoText);const isUpdated=lastDate&&fDate&&lastDate!==fDate;let memoDisp='';if(memoText){const parts=memoText.split('/').map(p=>p.trim());const latestMemo=parts[parts.length-1];memoDisp=(lastDate||fDate||'')+'  /  '+locDisp+'  /  '+replaceTeamName(latestMemo)}else{memoDisp=(fDate||'')+'  /  '+locDisp+'  /  특이사항 없음'}let memoStyle=isUpdated?'color:#27ae60;font-weight:bold':hasIssue?'color:#e74c3c;font-weight:bold':'color:#636e72';const isChecked=selectedEquipments.has(equipKey)?'checked':'';const equipColor=COLORS[r.category]||'#00b894';return '<div class="card-container"><input type="checkbox" class="equipment-checkbox" data-equipment=\''+equipData+'\' data-asset="'+equipKey+'" data-index="'+idx+'" onchange="updateSelection()" '+isChecked+'><div class="card"><div class="card-title" style="color:'+equipColor+';border-left:4px solid '+equipColor+';padding-left:10px">'+title+'</div><div class="card-divider"></div><div class="card-memo" style="'+memoStyle+'">'+memoDisp+'</div></div></div>'}

function hasConv(memo){

  return /1\s*BX\s*[=x×→]\s*\d+\s*EA/i.test(memo) || /\d+\s*EA\s*[=x×→]\s*1\s*BX/i.test(memo)

     || /1\s*BX\s*[=x×→]\s*\d+\s*PK/i.test(memo) || /\d+\s*PK\s*[=x×→]\s*1\s*BX/i.test(memo);

    var nm=(it.name||'').trim();
    var ov=UNIT_CONV_MAP[nm];

  var bxEa = mBxEa ? parseInt(mBxEa[1]) : null;
  var pkEa = mPkEa ? parseInt(mPkEa[1]) : null;
  var bxPk = mBxPk ? parseInt(mBxPk[1]) : null;

  if(bxEa==null && bxPk!=null && pkEa!=null) bxEa = bxPk*pkEa;
  if(pkEa==null && bxEa!=null && bxPk!=null) pkEa = bxEa/bxPk;

    r.BX = bxEa;

    r.EA = pkEa;
  } else if(baseUnit==='BX'){
    r.PK = bxPk!=null ? 1/bxPk : null;
    r.EA = bxEa!=null ? 1/bxEa : null;
  }
  r[baseUnit] = 1;
  return r;
}

function toBase(q, u, r, baseUnit){
  if(u === baseUnit) return q;
  var mult = r[u];
  if(mult == null) return null;
  return q * mult;
}

function dispQty(n, r, baseUnit){
  baseUnit = baseUnit || 'EA';
  n = Math.max(0, Number(n) || 0);
  var order = ['BX','PK','EA'];
  var biggerUnits = order.slice(0, order.indexOf(baseUnit));
  var rem = n, parts = [];
  biggerUnits.forEach(function(u){
    var mult = r[u];
    if(mult && rem >= mult){
      var v = Math.floor(rem / mult);
      rem = rem % mult;
      if(v) parts.push(v+u);
    }
  });
  if(rem || !parts.length) parts.push(rem + baseUnit);
  return parts.join(' ');
}

function ig(id){return document.getElementById(id);}
function iv(id){return(ig(id)?ig(id).value.trim():'');}
function spin(v){ig('invSpin').classList.toggle('on',v);}
function showModal(){ig('mBg').classList.add('show');}
function invCloseModal(){ig('mBg').classList.remove('show');}
function ieid(s){return s.replace(/[^a-zA-Z0-9가-힣]/g,'_');}
function invPost(body,cb){spin(true);fetch(INV_API,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){spin(false);cb(null,d);}).catch(function(e){spin(false);cb(e);});}
function invGet(action,cb){spin(true);fetch(INV_API+'?action='+action+'&t='+Date.now()).then(function(r){return r.json();}).then(function(d){spin(false);cb(null,d);}).catch(function(e){spin(false);cb(e);});}

function showLogin(){ig('pgReg').style.display='none';ig('pgLogin').style.display='block';}
function showReg(){ig('pgLogin').style.display='none';ig('pgReg').style.display='block';}
function invDoLogin(){
  var empId=iv('lId'),pass=iv('lPw');
  if(!empId||!pass){alert('사번과 비밀번호를 입력하세요');return;}
  invPost({action:'login',empId:empId,pass:pass},function(err,r){
    if(err){alert('서버 오류');return;}
    if(r.success){invUser=r.user;invUser.password=pass;localStorage.setItem('invUser',JSON.stringify(invUser));invStartApp();}
    else alert(r.error||'로그인 실패');
  });
}
function doReg(){
  var name=iv('rName'),empId=iv('rId'),pass=iv('rPw'),team=iv('rTeam');
  if(!name||!empId||!pass||!team){alert('모든 항목을 입력하세요');return;}
  invPost({action:'register',empId:empId,name:name,pass:pass,team:team},function(err,r){
    if(err){alert('서버 오류');return;}
    if(r.success){alert(r.message||'완료');if(r.user){invUser=r.user;invUser.password=pass;localStorage.setItem('invUser',JSON.stringify(invUser));invStartApp();}else showLogin();}
    else alert(r.error||'가입 실패');
  });
}
function doLogout(){
  if(!confirm('로그아웃?'))return;
  localStorage.removeItem('invUser');invUser=null;
  ig('pgApp').style.display='none';ig('pgLogin').style.display='block';
  ig('lId').value='';ig('lPw').value='';
}
function invStartApp(){
  ig('pgLogin').style.display='none';ig('pgReg').style.display='none';ig('pgApp').style.display='block';
  ig('hSub').textContent=invUser.name+' · '+invUser.team;
  if(String(invUser.empId)===INV_ADMIN)ig('invAdminBtn').style.display='block';
  buildTabs();buildCats();loadData(false);
}
function buildTabs(){
  var all=TABS.slice();if(String(invUser.empId)===INV_ADMIN)all.push('관리자');
  ig('tabBar').innerHTML=all.map(function(t){return '<button class="tb'+(t===curTab?' on':'')+'" data-t="'+t+'">'+( t==='창고'?'🏭창고':t==='거래내역'?'📋거래':t==='관리자'?'👥관리자':t)+'</button>';}).join('');
  ig('tabBar').querySelectorAll('.tb').forEach(function(btn){btn.onclick=function(){goTab(this.dataset.t);};});
}
function buildCats(){
  var hide=curTab==='거래내역'||curTab==='관리자';
  ig('catBar').style.display=hide?'none':'flex';
  ig('srchBox').style.display=hide?'none':'block';
  if(hide)return;
  ig('catBar').innerHTML=CATS.map(function(c){var col=CCOLORS[c],on=c===curCat;return '<button class="cc" data-c="'+c+'" style="'+(on?'background:'+col+';color:#fff;border-color:'+col:'color:'+col+';border-color:'+col+'40')+'">'+c+'</button>';}).join('');
  ig('catBar').querySelectorAll('.cc').forEach(function(btn){btn.onclick=function(){goCat(this.dataset.c);};});
}
function goTab(t){curTab=t;buildTabs();buildCats();render();}
function goCat(c){curCat=c;buildCats();render();}
function loadData(force){
  if(!force){var c=localStorage.getItem('invCache');if(c){try{var p=JSON.parse(c);if(Date.now()-p.t<180000){items=applyUnitOverrides(p.items);teamStocks=p.ts;txs=p.txs;render();return;}}catch(e){}}}
  invGet('getAll',function(err,d){
    if(err){alert('로딩 실패');return;}
    items=applyUnitOverrides(d.items||[]);teamStocks=d.teamStocks||{};txs=d.transactions||[];
    localStorage.setItem('invCache',JSON.stringify({items:items,ts:teamStocks,txs:txs,t:Date.now()}));
    render();
  });
}
function invReload(){localStorage.removeItem('invCache');loadData(true);}

function render(){
  var el=ig('content');
  if(curTab==='거래내역'){renderTx(el);return;}
  if(curTab==='관리자'){renderAdmin(el);return;}
  var q=ig('srchIn')?ig('srchIn').value.toLowerCase():'';
  var isWH=curTab==='창고';
  var list=items.map(function(i){
    var baseUnit=computeBaseUnit(i);
    var r=parseR(i.memo,baseUnit);
    var eaQty=isWH?i.eaQty:((teamStocks[curTab]||{})[i.name]?teamStocks[curTab][i.name].eaQty:0);
    return{name:i.name,unit:baseUnit,memo:i.memo,category:i.category,eaQty:eaQty,r:r,dsp:dispQty(eaQty,r,baseUnit)};
  }).filter(function(i){
    if(q&&i.name.toLowerCase().indexOf(q)<0)return false;
    if(curCat!=='전체'&&i.category!==curCat)return false;
    if(!isWH&&i.eaQty<=0)return false;
    return true;
  });
  if(!list.length){el.innerHTML='<div class="empty">📭<br>물품이 없습니다</div>';return;}
  var html='';
  if(curCat==='전체'){
    var grp={};list.forEach(function(i){if(!grp[i.category])grp[i.category]=[];grp[i.category].push(i);});
    CATS.filter(function(c){return c!=='전체';}).forEach(function(cat){
      if(!grp[cat]||!grp[cat].length)return;
      var col=CCOLORS[cat];
      html+='<div class="cat-hd"><span class="cat-hd-dot" style="background:'+col+'"></span><span style="color:'+col+'">'+cat+' ('+grp[cat].length+')</span></div>';
      grp[cat].forEach(function(i){html+=invCard(i,isWH);});
    });
  } else {
    list.forEach(function(i){html+=invCard(i,isWH);});
  }
  el.innerHTML=html;
}

function invCard(i,isWH){
  var col=CCOLORS[i.category]||'#94A3B8';
  var low=i.eaQty>0&&i.eaQty<5;
  var qc=i.eaQty>0?(low?'low':'pos'):i.eaQty<0?'neg':'zero';
  var baseUnit=i.unit||'EA';
  var r=i.r;
  var nm=i.name.replace(/'/g,"\\'");

  var order=['BX','PK','EA'];
  var opts=order.filter(function(u){return u===baseUnit||r[u]!=null;});
  var optHtml=opts.map(function(u){
    var label=u;
    if(u!==baseUnit&&r[u]!=null) label+='(1='+r[u]+baseUnit+')';
    return '<option value="'+u+'"'+(u===baseUnit?' selected':'')+'>'+label+'</option>';
  }).join('');

  var btns=isWH
    ?'<button class="ia in" onclick="doIn1(\''+nm+'\')">📥입고</button><button class="ia out" onclick="doOut1(\''+nm+'\')">📤출고</button>'
    :'<button class="ia ret" onclick="doRet1(\''+nm+'\')">↩반납</button><button class="ia con" onclick="doCon1(\''+nm+'\')">🔥소비</button>';
  return '<div class="icard" id="ic_'+ieid(i.name)+'">'
    +'<div class="icard-top">'
    +'<span class="ibar" style="background:'+col+'"></span>'
    +'<span class="iname'+(low?' low':'')+'">'+(low?'⚠️':'')+i.name+(i.memo?'<br><span class="imemo">'+i.memo+'</span>':'')+'</span>'
    +'<div class="iqty '+qc+'">'+i.dsp+'</div>'
    +'</div>'
    +'<div class="icard-bot">'
    +'<input type="number" class="inum" id="qn_'+ieid(i.name)+'" value="1" min="1">'
    +'<select class="isel" id="un_'+ieid(i.name)+'">'+optHtml+'</select>'
    +btns
    +'</div></div>';
}

function doIn1(name){
  var i=null;for(var k=0;k<items.length;k++){if(items[k].name===name){i=items[k];break;}}
  if(!i)return;
  var baseUnit=computeBaseUnit(i);
  var r=parseR(i.memo,baseUnit);
  var qty=parseInt(ig('qn_'+ieid(name)).value)||1;
  var unit=ig('un_'+ieid(name)).value||baseUnit;
  var eaQty=toBase(qty,unit,r,baseUnit);
  if(eaQty==null){alert('이 물품은 '+unit+' 단위 환산 정보가 메모에 없습니다.');return;}
  invPost({action:'warehouseIn',items:[{name:name,unit:baseUnit,memo:i.memo,category:i.category,inputQty:qty,inputUnit:unit,eaQty:eaQty}],user:invUser.name},function(err,res){
    if(err){alert('오류');return;}
    if(res.success){invReload();alert('입고 완료!');}else alert('오류: '+res.error);
  });
}

function doOut1(name){
  var i=null;for(var k=0;k<items.length;k++){if(items[k].name===name){i=items[k];break;}}
  if(!i)return;
  var baseUnit=computeBaseUnit(i);
  var r=parseR(i.memo,baseUnit);
  var qty=parseInt(ig('qn_'+ieid(name)).value)||1;
  var unit=ig('un_'+ieid(name)).value||baseUnit;
  var eaQty=toBase(qty,unit,r,baseUnit);
  if(eaQty==null){alert('이 물품은 '+unit+' 단위 환산 정보가 메모에 없습니다.');return;}
  pendingOut={name:name,item:i,qty:qty,unit:unit,eaQty:eaQty};
  ig('mSheet').innerHTML='<div class="modal-handle"></div>'
    +'<div class="modal-title">📤 출고 - '+name+' '+qty+unit+'</div>'
    +'<div style="font-size:13px;color:var(--sub);margin-bottom:12px">어느 팀으로 출고할까요?</div>'
    +'<div class="team-grid">'+['화성','수원','평택','2팀','3팀','4팀','5팀','6팀'].map(function(t){return '<button class="tbtn" data-t="'+t+'">'+t+'</button>';}).join('')+'</div>'
    +'<button class="ok-btn" onclick="confirmOut()">출고 확인</button>';
  ig('mSheet').querySelectorAll('.tbtn').forEach(function(btn){btn.onclick=function(){ig('mSheet').querySelectorAll('.tbtn').forEach(function(b){b.classList.remove('on');});this.classList.add('on');pendingOut.team=this.dataset.t;};});
  showModal();
}
function confirmOut(){
  if(!pendingOut||!pendingOut.team){alert('팀을 선택하세요');return;}
  var po=pendingOut,i=po.item;
  var baseUnit=computeBaseUnit(i);
  invCloseModal();
  invPost({action:'warehouseOut',items:[{name:po.name,unit:baseUnit,memo:i.memo,category:i.category,inputQty:po.qty,inputUnit:po.unit,eaQty:po.eaQty}],team:po.team,user:invUser.name},function(err,res){
    if(err){alert('오류');return;}
    if(res.success){pendingOut=null;invReload();alert(po.team+'으로 출고 완료!');}else alert('오류: '+res.error);
  });
}

function doRet1(name){
  var i=null;for(var k=0;k<items.length;k++){if(items[k].name===name){i=items[k];break;}}
  var baseUnit=i?computeBaseUnit(i):'EA';

    if(err){alert('오류');return;}
    if(res.success){invReload();alert('반납 완료!');}else alert('오류: '+res.error);

function doCon1(name){

  });
}

function renderTx(el){
  if(!txs.length){el.innerHTML='<div class="empty">📋<br>거래내역 없음</div>';return;}
  el.innerHTML=txs.map(function(t){return '<div class="txcard"><span class="txbadge '+t.type+'">'+t.type+'</span><span style="font-size:11px;color:var(--sub)">'+( t.date||'')+'</span><div class="txcont">'+(t.content||'')+'</div><div class="txmeta">'+(t.from||'')+' → '+(t.to||'')+' · '+(t.user||'')+'</div></div>';}).join('');
}

function renderAdmin(el){
  invPost({action:'getUsers'},function(err,r){
    if(err||!r.success){el.innerHTML='<div class="empty">오류</div>';return;}
    var pend=r.users.filter(function(u){return u.status==='대기';});
    var appr=r.users.filter(function(u){return u.status==='승인';});
    var html='';
    if(pend.length){html+='<div class="sec-lbl">⏳ 승인 대기 ('+pend.length+'명)</div>';pend.forEach(function(u){html+='<div class="ucard"><div class="uname">'+u.name+'</div><div class="umeta">'+u.empId+' · '+u.team+'</div><div class="ubtns"><button class="ub ap" data-eid="'+u.empId+'">승인</button><button class="ub rj" data-eid="'+u.empId+'" data-n="'+u.name+'">거부</button></div></div>';});}
    if(appr.length){html+='<div class="sec-lbl">✅ 승인된 ('+appr.length+'명)</div>';appr.forEach(function(u){html+='<div class="ucard"><div class="uname">'+u.name+'</div><div class="umeta">'+u.empId+' · '+u.team+'</div><div class="ubtns"><button class="ub dl" data-eid="'+u.empId+'" data-n="'+u.name+'">삭제</button></div></div>';});}
    el.innerHTML=html;
    el.querySelectorAll('.ub.ap').forEach(function(b){b.onclick=function(){invApprU(this.dataset.eid);};});
    el.querySelectorAll('.ub.rj,.ub.dl').forEach(function(b){b.onclick=function(){invDelU(this.dataset.eid,this.dataset.n);};});
  });
}
function invApprU(empId){if(!confirm('승인?'))return;invPost({action:'approveUser',empId:empId},function(err,r){if(r&&r.success){alert('완료');renderAdmin(ig('content'));}else alert(r?r.error:'오류');});}
function invDelU(empId,name){if(!confirm(name+' 삭제?'))return;invPost({action:'deleteUser',empId:empId},function(err,r){if(r&&r.success){alert('완료');renderAdmin(ig('content'));}else alert(r?r.error:'오류');});}
</script>
