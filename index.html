<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>소모품관리</title>
<style>
:root{--blue:#2563EB;--green:#059669;--red:#DC2626;--purple:#7C3AED;--gray:#64748B;--bg:#F1F5F9;--card:#fff;--border:#E2E8F0;--text:#0F172A;--sub:#64748B}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text)}

/* 로그인 */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(150deg,#1D4ED8,#3B82F6);padding:20px}
.auth-card{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-icon{text-align:center;font-size:42px;margin-bottom:14px}
.auth-h{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.auth-s{text-align:center;font-size:13px;color:var(--sub);margin-bottom:24px}
.inp{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--blue)}
.sel{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;margin-bottom:10px;background:#fff}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--bg);color:var(--gray);font-size:13px}

/* 앱 헤더 */
.hdr{background:var(--blue);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.hdr-l h1{font-size:15px;font-weight:800}
.hdr-l p{font-size:11px;opacity:.75;margin-top:1px}
.hdr-r{display:flex;gap:6px}
.hb{padding:6px 10px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}

/* 탭 */
.tabs{display:flex;overflow-x:auto;gap:4px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tb{flex-shrink:0;padding:7px 14px;border:none;border-radius:20px;background:var(--bg);color:var(--sub);font-size:13px;font-weight:600;cursor:pointer}
.tb.on{background:var(--blue);color:#fff}

/* 카테고리 */
.cats{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--border)}
.cats::-webkit-scrollbar{display:none}
.cc{flex-shrink:0;padding:5px 13px;border:2px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap}

/* 검색 */
.srch{padding:8px 10px;background:#fff;border-bottom:1px solid var(--border)}
.srch input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--bg)}
.srch input:focus{border-color:var(--blue);background:#fff}

/* 물품 리스트 - 핵심 */
.list{padding:8px 10px}
.cat-hd{display:flex;align-items:center;gap:6px;padding:10px 2px 6px;font-size:12px;font-weight:700;color:var(--sub)}
.cat-hd-dot{width:8px;height:8px;border-radius:50%}

/* 물품 카드 - 한줄 컴팩트 */
.icard{background:#fff;border-radius:12px;margin-bottom:6px;border:1.5px solid var(--border);overflow:hidden}
.icard.checked{border-color:var(--blue)}
/* 위쪽: 이름 + 현재수량 */
.icard-top{display:flex;align-items:center;padding:10px 12px 6px;gap:8px}
.icb{width:18px;height:18px;cursor:pointer;accent-color:var(--blue);flex-shrink:0}
.ibar{width:3px;height:32px;border-radius:3px;flex-shrink:0}
.iname{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imemo{font-size:11px;color:var(--sub)}
.iqty{font-size:16px;font-weight:800;text-align:right;flex-shrink:0;padding-left:8px}
.iqty.pos{color:var(--green)}
.iqty.neg{color:var(--red)}
.iqty.zero{color:var(--border)}
.iunit{font-size:10px;color:var(--sub);text-align:right}

/* 아래쪽: 수량입력 + 단위 + 버튼 */
.icard-bot{display:flex;align-items:center;gap:6px;padding:6px 12px 10px;background:#FAFAFA;border-top:1px solid var(--border)}
.inum{width:56px;padding:7px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-weight:700;text-align:center;background:#fff;outline:none}
.inum:focus{border-color:var(--blue)}
.isel{flex:1;padding:7px 6px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;background:#fff;outline:none}
.isel:focus{border-color:var(--blue)}
.ia{padding:7px 10px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap}
.ia.in{background:var(--green)}
.ia.out{background:var(--red)}
.ia.ret{background:var(--purple)}

/* 팀선택 모달 (출고시) */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:70vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:800;margin-bottom:14px}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tbtn{padding:14px 4px;border:2px solid var(--border);border-radius:10px;background:#fff;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;text-align:center}
.tbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.ok-btn{width:100%;padding:15px;background:var(--red);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}

/* 거래내역 */
.txcard{background:#fff;border-radius:12px;margin-bottom:6px;border:1.5px solid var(--border);padding:12px 14px}
.txbadge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;margin-right:6px}
.txbadge.입고{background:#D1FAE5;color:#059669}
.txbadge.출고{background:#FEE2E2;color:#DC2626}
.txbadge.반납{background:#EDE9FE;color:#7C3AED}
.txcont{font-size:13px;font-weight:600;margin:4px 0 2px}
.txmeta{font-size:11px;color:var(--sub)}

/* 회원관리 */
.ucard{background:#fff;border-radius:12px;margin-bottom:6px;border:1.5px solid var(--border);padding:14px}
.uname{font-size:15px;font-weight:700}
.umeta{font-size:12px;color:var(--sub);margin:2px 0 8px}
.ubtns{display:flex;gap:6px}
.ub{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}
.ub.ap{background:var(--green)}.ub.rj{background:var(--red)}.ub.dl{background:var(--gray)}
.sec-lbl{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;padding:10px 2px 6px}

/* 로딩 */
.spin{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:999;align-items:center;justify-content:center}
.spin.on{display:flex}
.spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.spacer{height:20px}
</style>
</head>
<body>

<div class="spin" id="spin"><div class="spinner"></div></div>
<div class="modal-bg" id="mBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="mSheet"></div>
</div>

<!-- 로그인 -->
<div id="pgLogin">
<div class="auth-page"><div class="auth-card">
  <div class="auth-icon">📦</div>
  <div class="auth-h">소모품관리</div>
  <div class="auth-s">사번과 비밀번호를 입력하세요</div>
  <input class="inp" id="lId" placeholder="사번" type="text">
  <input class="inp" id="lPw" placeholder="비밀번호" type="password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn btn-p" onclick="doLogin()">로그인</button>
  <button class="btn btn-g" onclick="showReg()">처음이세요? 회원가입</button>
</div></div>
</div>

<!-- 회원가입 -->
<div id="pgReg" style="display:none">
<div class="auth-page"><div class="auth-card">
  <div class="auth-icon">✍️</div>
  <div class="auth-h">회원가입</div>
  <div class="auth-s">정보를 입력하세요</div>
  <input class="inp" id="rName" placeholder="이름">
  <input class="inp" id="rId" placeholder="사번" type="text">
  <input class="inp" id="rPw" placeholder="비밀번호" type="password">
  <select class="sel" id="rTeam">
    <option value="">팀 선택</option>
    <option value="화성">화성</option><option value="수원">수원</option>
    <option value="평택">평택</option><option value="2팀">2팀</option>
    <option value="3팀">3팀</option><option value="4팀">4팀</option>
    <option value="5팀">5팀</option><option value="6팀">6팀</option>
    <option value="창고">창고관리자</option>
  </select>
  <button class="btn btn-p" onclick="doReg()">가입 신청</button>
  <button class="btn btn-g" onclick="showLogin()">← 로그인으로</button>
</div></div>
</div>

<!-- 메인 -->
<div id="pgApp" style="display:none">
  <div class="hdr">
    <div class="hdr-l"><h1>📦 소모품관리</h1><p id="hSub"></p></div>
    <div class="hdr-r">
      <button id="adminBtn" class="hb" style="background:rgba(255,255,255,.2);color:#fff;display:none" onclick="goTab('관리자')">👥</button>
      <button class="hb" style="background:rgba(255,255,255,.2);color:#fff" onclick="reload()">🔄</button>
      <button class="hb" style="background:rgba(255,255,255,.15);color:#fff" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="tabs" id="tabBar"></div>
  <div class="cats" id="catBar"></div>
  <div class="srch" id="srchBox"><input id="srchIn" placeholder="🔍 물품 검색..." oninput="render()"></div>
  <div class="list" id="content"></div>
  <div class="spacer"></div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbyvR0ca8wLqihHRh8l1xDpapYbRiaipmIhmZOb_CkQb0AoTmHvVjolChAadQvR8Oata/exec';
const ADMIN='218062';
const TABS=['창고','화성','수원','평택','2팀','3팀','4팀','5팀','6팀','거래내역'];
const CATS=['채혈채뇨','공용물품','청력','HRV','EKG','폐활량','전체'];
const CCOLORS={'채혈채뇨':'#2563EB','공용물품':'#6B7280','청력':'#D97706','HRV':'#0891B2','EKG':'#7C3AED','폐활량':'#475569','전체':'#059669'};

let user=null,curTab='창고',curCat='채혈채뇨',items=[],teamStocks={},txs=[],pendingOut=null;

// 단위변환
function parseR(memo){const r={BX:null,PK:null};if(!memo)return r;const b=memo.match(/1\s*BX\s*[=x×]\s*(\d+)\s*EA/i);if(b)r.BX=+b[1];const p=memo.match(/1\s*PK\s*[=x×]\s*(\d+)\s*EA/i);if(p)r.PK=+p[1];const bp=memo.match(/1\s*BX\s*[=x×]\s*(\d+)\s*PK/i);if(bp&&r.PK)r.BX=+bp[1]*r.PK;return r;}
function toEA(q,u,r){if(u==='BX')return q*(r.BX||1);if(u==='PK')return q*(r.PK||1);return q;}
function disp(ea,r,unit){const n=Math.max(0,+ea||0);if(!r.BX&&!r.PK)return n+(unit?' '+unit:' EA');let rem=n,p=[];if(r.BX&&rem>=r.BX){const v=Math.floor(rem/r.BX);rem=rem%r.BX;if(v)p.push(v+'BX');}if(r.PK&&rem>=r.PK){const v=Math.floor(rem/r.PK);rem=rem%r.PK;if(v)p.push(v+'PK');}if(rem||!p.length)p.push(rem+'EA');return p.join(' ');}

// 유틸
function g(id){return document.getElementById(id);}
function val(id){return(g(id)?.value||'').trim();}
function spin(v){g('spin').classList.toggle('on',v);}
function showModal(){g('mBg').classList.add('show');}
function closeModal(){g('mBg').classList.remove('show');}
function eid(s){return s.replace(/[^a-zA-Z0-9가-힣]/g,'_');}
async function post(body){const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});return r.json();}

// 인증
function showLogin(){g('pgReg').style.display='none';g('pgLogin').style.display='block';}
function showReg(){g('pgLogin').style.display='none';g('pgReg').style.display='block';}

async function doLogin(){
  const empId=val('lId'),pass=val('lPw');
  if(!empId||!pass){alert('사번과 비밀번호를 입력하세요');return;}
  spin(true);
  try{
    const r=await post({action:'login',empId,pass});
    if(r.success){user=r.user;user.password=pass;localStorage.setItem('invUser',JSON.stringify(user));startApp();}
    else alert(r.error||'로그인 실패');
  }catch(e){alert('서버 오류');}finally{spin(false);}
}

async function doReg(){
  const name=val('rName'),empId=val('rId'),pass=val('rPw'),team=val('rTeam');
  if(!name||!empId||!pass||!team){alert('모든 항목을 입력하세요');return;}
  spin(true);
  try{
    const r=await post({action:'register',empId,name,pass,team});
    if(r.success){alert(r.message||'완료');if(r.user){user=r.user;user.password=pass;localStorage.setItem('invUser',JSON.stringify(user));startApp();}else showLogin();}
    else alert(r.error||'가입 실패');
  }catch(e){alert('서버 오류');}finally{spin(false);}
}

function doLogout(){
  if(!confirm('로그아웃?'))return;
  localStorage.removeItem('invUser');user=null;
  g('pgApp').style.display='none';g('pgLogin').style.display='block';
  g('lId').value='';g('lPw').value='';
}

// 앱 시작
function startApp(){
  g('pgLogin').style.display='none';g('pgReg').style.display='none';g('pgApp').style.display='block';
  g('hSub').textContent=user.name+' · '+user.team;
  if(String(user.empId)===ADMIN)g('adminBtn').style.display='block';
  buildTabs();buildCats();loadData(false);
}

function buildTabs(){
  const all=[...TABS];if(String(user.empId)===ADMIN)all.push('관리자');
  g('tabBar').innerHTML=all.map(t=>`<button class="tb${t===curTab?' on':''}" onclick="goTab('${t}')">${t==='창고'?'🏭창고':t==='거래내역'?'📋거래':t==='관리자'?'👥관리자':t}</button>`).join('');
}

function buildCats(){
  const hide=curTab==='거래내역'||curTab==='관리자';
  g('catBar').style.display=hide?'none':'flex';
  g('srchBox').style.display=hide?'none':'block';
  if(hide)return;
  g('catBar').innerHTML=CATS.map(c=>{
    const col=CCOLORS[c];const on=c===curCat;
    return `<button class="cc" style="${on?'background:'+col+';color:#fff;border-color:'+col:'color:'+col+';border-color:'+col+'40'}" onclick="goCat('${c}')">${c}</button>`;
  }).join('');
}

function goTab(t){curTab=t;buildTabs();buildCats();render();}
function goCat(c){curCat=c;buildCats();render();}

// 데이터
async function loadData(force){
  if(!force){const c=localStorage.getItem('invCache');if(c){const p=JSON.parse(c);if(Date.now()-p.t<180000){items=p.items;teamStocks=p.ts;txs=p.txs;render();return;}}}
  spin(true);
  try{
    const res=await fetch(API+'?action=getAll&t='+Date.now());
    const d=await res.json();
    items=d.items||[];teamStocks=d.teamStocks||{};txs=d.transactions||[];
    localStorage.setItem('invCache',JSON.stringify({items,ts:teamStocks,txs,t:Date.now()}));
    render();
  }catch(e){alert('로딩 실패');}finally{spin(false);}
}
async function reload(){localStorage.removeItem('invCache');await loadData(true);}

// 렌더링
function render(){
  const el=g('content');
  if(curTab==='거래내역'){renderTx(el);return;}
  if(curTab==='관리자'){renderAdmin(el);return;}

  const q=(val('srchIn')||'').toLowerCase();
  const list=items.map(i=>{
    const r=parseR(i.memo);
    const eaQty=curTab==='창고'?i.eaQty:((teamStocks[curTab]||{})[i.name]?.eaQty||0);
    return{...i,eaQty,r,dsp:disp(eaQty,r,i.unit)};
  }).filter(i=>(!q||i.name.toLowerCase().includes(q))&&(curCat==='전체'||i.category===curCat));

  if(!list.length){el.innerHTML='<div class="empty">📭<br>물품이 없습니다</div>';return;}

  const isWH=curTab==='창고';
  let html='';

  if(curCat==='전체'){
    const grp={};list.forEach(i=>{(grp[i.category]=grp[i.category]||[]).push(i);});
    CATS.filter(c=>c!=='전체').forEach(cat=>{
      if(!grp[cat]?.length)return;
      const col=CCOLORS[cat];
      html+=`<div class="cat-hd"><span class="cat-hd-dot" style="background:${col}"></span><span style="color:${col}">${cat}</span><span style="margin-left:auto;font-size:11px">${grp[cat].length}개</span></div>`;
      html+=grp[cat].map(i=>itemCard(i,isWH)).join('');
    });
  } else {
    html=list.map(i=>itemCard(i,isWH)).join('');
  }
  el.innerHTML=html;
}

function itemCard(i,isWH){
  const col=CCOLORS[i.category]||'#94A3B8';
  const qc=i.eaQty>0?'pos':i.eaQty<0?'neg':'zero';
  const r=i.r;
  const bxL=r.BX?`BX(1=${r.BX}EA)`:'BX';
  const pkL=r.PK?`PK(1=${r.PK}EA)`:'PK';
  const nm=i.name.replace(/'/g,"\\'");
  const btnHtml=isWH
    ?`<button class="ia in"  onclick="doIn1('${nm}')">📥입고</button><button class="ia out" onclick="doOut1('${nm}')">📤출고</button>`
    :`<button class="ia ret" onclick="doRet1('${nm}')">↩반납</button>`;
  return `<div class="icard" id="ic_${eid(i.name)}">
    <div class="icard-top">
      <span class="ibar" style="background:${col}"></span>
      <span class="iname">${i.name}${i.memo?`<br><span class="imemo">${i.memo}</span>`:''}</span>
      <div style="text-align:right;flex-shrink:0">
        <div class="iqty ${qc}">${i.dsp}</div>
      </div>
    </div>
    <div class="icard-bot">
      <input type="number" class="inum" id="qn_${eid(i.name)}" value="1" min="1">
      <select class="isel" id="un_${eid(i.name)}">
        <option value="EA">EA</option>
        <option value="PK">${pkL}</option>
        <option value="BX">${bxL}</option>
      </select>
      ${btnHtml}
    </div>
  </div>`;
}

// 단건 입고
async function doIn1(name){
  const i=items.find(x=>x.name===name);if(!i)return;
  const r=parseR(i.memo);
  const qty=+(g('qn_'+eid(name))?.value)||1;
  const unit=g('un_'+eid(name))?.value||'EA';
  const eaQty=toEA(qty,unit,r);
  spin(true);
  try{
    const res=await post({action:'warehouseIn',items:[{name,unit:i.unit,memo:i.memo,category:i.category,inputQty:qty,inputUnit:unit,eaQty}],user:user.name});
    if(res.success){await reload();alert('입고 완료!');}else alert('오류: '+res.error);
  }finally{spin(false);}
}

// 단건 출고 - 팀 선택 모달
function doOut1(name){
  pendingOut={name};
  const i=items.find(x=>x.name===name);if(!i)return;
  const r=parseR(i.memo);
  const qty=+(g('qn_'+eid(name))?.value)||1;
  const unit=g('un_'+eid(name))?.value||'EA';
  pendingOut.qty=qty;pendingOut.unit=unit;pendingOut.eaQty=toEA(qty,unit,r);pendingOut.item=i;
  g('mSheet').innerHTML=`
    <div class="modal-handle"></div>
    <div class="modal-title">📤 출고 - ${name} ${qty}${unit}</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:12px">어느 팀으로 출고할까요?</div>
    <div class="team-grid">
      ${['화성','수원','평택','2팀','3팀','4팀','5팀','6팀'].map(t=>`<button class="tbtn" onclick="pickT(this,'${t}')">${t}</button>`).join('')}
    </div>
    <button class="ok-btn" onclick="confirmOut()">출고 확인</button>`;
  showModal();
}

function pickT(el,t){document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');pendingOut.team=t;}

async function confirmOut(){
  if(!pendingOut?.team){alert('팀을 선택하세요');return;}
  const{name,unit,memo,category,inputQty:qty,inputUnit,eaQty,team,item:i}=pendingOut;
  closeModal();spin(true);
  try{
    const res=await post({action:'warehouseOut',items:[{name,unit:i.unit,memo:i.memo,category:i.category,inputQty:qty,inputUnit,eaQty}],team,user:user.name});
    if(res.success){pendingOut=null;await reload();alert(team+'으로 출고 완료!');}else alert('오류: '+res.error);
  }finally{spin(false);}
}

// 단건 반납
async function doRet1(name){
  const i=items.find(x=>x.name===name)||{};
  const r=parseR(i.memo||'');
  const qty=+(g('qn_'+eid(name))?.value)||1;
  const unit=g('un_'+eid(name))?.value||'EA';
  const eaQty=toEA(qty,unit,r);
  if(!confirm(`${name} ${qty}${unit} 반납할까요?`))return;
  spin(true);
  try{
    const res=await post({action:'teamReturn',items:[{name,unit:i.unit||unit,memo:i.memo||'',category:i.category||'',inputQty:qty,inputUnit:unit,eaQty}],team:curTab,user:user.name});
    if(res.success){await reload();alert('반납 완료!');}else alert('오류: '+res.error);
  }finally{spin(false);}
}

function renderTx(el){
  if(!txs.length){el.innerHTML='<div class="empty">📋<br>거래내역 없음</div>';return;}
  el.innerHTML=txs.map(t=>`<div class="txcard">
    <span class="txbadge ${t.type}">${t.type}</span><span style="font-size:11px;color:var(--sub)">${t.date||''}</span>
    <div class="txcont">${t.content||''}</div>
    <div class="txmeta">${t.from||''} → ${t.to||''} · ${t.user||''}</div>
  </div>`).join('');
}

async function renderAdmin(el){
  spin(true);
  try{
    const r=await post({action:'getUsers'});
    if(!r.success){el.innerHTML='<div class="empty">오류</div>';return;}
    const pend=r.users.filter(u=>u.status==='대기');
    const appr=r.users.filter(u=>u.status==='승인');
    let html='';
    if(pend.length){html+=`<div class="sec-lbl">⏳ 승인 대기 (${pend.length}명)</div>`;html+=pend.map(u=>`<div class="ucard"><div class="uname">${u.name}</div><div class="umeta">${u.empId} · ${u.team}</div><div class="ubtns"><button class="ub ap" onclick="apprU('${u.empId}')">승인</button><button class="ub rj" onclick="delU('${u.empId}','${u.name}')">거부</button></div></div>`).join('');}
    if(appr.length){html+=`<div class="sec-lbl">✅ 승인된 사용자 (${appr.length}명)</div>`;html+=appr.map(u=>`<div class="ucard"><div class="uname">${u.name}</div><div class="umeta">${u.empId} · ${u.team}</div><div class="ubtns"><button class="ub dl" onclick="delU('${u.empId}','${u.name}')">삭제</button></div></div>`).join('');}
    el.innerHTML=html;
  }finally{spin(false);}
}

async function apprU(empId){if(!confirm('승인?'))return;spin(true);const r=await post({action:'approveUser',empId});spin(false);if(r.success){alert('완료');renderAdmin(g('content'));}else alert(r.error);}
async function delU(empId,name){if(!confirm(name+' 삭제?'))return;spin(true);const r=await post({action:'deleteUser',empId});spin(false);if(r.success){alert('완료');renderAdmin(g('content'));}else alert(r.error);}

window.onload=function(){const s=localStorage.getItem('invUser');if(s){user=JSON.parse(s);startApp();}};
</script>
</body>
</html>
